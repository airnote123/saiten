<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>採点エディタ v2.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- QRコード読み取り (jsQR) & 生成 (QRCode.js) -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { touch-action: none; -webkit-user-select: none; user-select: none; overflow: hidden; }
        #canvas-container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #cbd5e1;
            touch-action: none;
            cursor: grab;
        }
        #canvas-container:active { cursor: grabbing; }
        canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; pointer-events: none; }
        
        .tab-btn.active { background-color: #1e293b !important; color: white !important; }
        
        .scoring-card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            max-width: 1200px;
            margin: 0.5rem auto;
            padding: 0.5rem;
        }
        .crop-container {
            flex-grow: 1;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 160px;
            border-radius: 0.25rem;
            overflow: hidden;
            border: 1px solid #f1f5f9;
        }
        .crop-container canvas {
            position: static;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform: none !important;
        }
        .score-controls {
            width: 220px;
            padding-left: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-shrink: 0;
        }
        .score-input {
            font-size: 2rem;
            font-weight: 800;
            width: 80px;
            padding: 0.2rem;
            border-bottom: 3px solid #cbd5e1;
            text-align: center;
            color: #1e293b;
        }
        .score-input:focus { border-color: #3b82f6; outline: none; background: #eff6ff; }
        
        .guide-label {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: bold;
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .mode-question { background: #1e293b; color: white; }
        .mode-total { background: #f59e0b; color: white; }
        .mode-group { background: #10b981; color: white; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .qr-target-box {
            position: relative;
            width: 220px;
            height: 220px;
            border: 3px dashed #3b82f6;
            border-radius: 1.5rem;
            box-shadow: 0 0 0 4000px rgba(15, 23, 42, 0.5);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <div class="flex flex-col h-screen">
        <header class="bg-white border-b p-3 flex justify-between items-center shrink-0 shadow-sm z-30">
            <div class="flex items-center gap-4">
                <h1 class="text-lg font-black tracking-tighter text-slate-800 flex items-center gap-2">
                    <span class="bg-slate-800 text-white p-1 rounded">ES</span>
                    SCORER <span class="text-slate-400 font-medium text-[10px] ml-1 tracking-normal">v2.0</span>
                </h1>
                <!-- テスト・教科メタデータ表示 -->
                <div class="hidden md:flex items-center gap-2 text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-xl">
                    <span id="header-subject" class="text-blue-600">教科未設定</span> / 
                    <span id="header-testname">テスト名未設定</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div id="stats-summary" class="hidden md:flex items-center gap-4">
                    <div class="text-right">
                        <span class="text-[10px] text-slate-400 block font-bold">全体平均点</span>
                        <span id="total-avg" class="text-blue-600 font-black text-xl">0.0</span> <span class="text-slate-400 text-sm">/ <span id="total-max">0</span></span>
                    </div>
                </div>
                <button onclick="openMetaModal()" class="bg-slate-100 text-slate-700 px-3 py-2 rounded-xl font-bold text-xs hover:bg-slate-200 transition-all">
                    ⚙️ テスト設定
                </button>
                <button onclick="openCloudModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs hover:bg-emerald-700 transition-all shadow-sm cursor-pointer">
                    ☁️ クラウド保存
                </button>
            </div>
        </header>

        <!-- Step 1: File Upload -->
        <section id="step-1" class="flex-grow flex items-center justify-center p-6">
            <div class="max-w-md w-full border-2 border-dashed border-slate-300 rounded-2xl p-12 text-center bg-white hover:border-blue-400 transition-all cursor-pointer shadow-sm">
                <input type="file" id="file-input" multiple accept="application/pdf,image/*" class="hidden">
                <label for="file-input" class="cursor-pointer block">
                    <div class="text-slate-200 text-6xl mb-6">📄</div>
                    <div class="text-xl font-bold text-slate-700">採点するファイルをアップロード</div>
                    <p class="text-slate-400 text-sm mt-3">PDFまたは画像を選択してください</p>
                </label>
            </div>
        </section>

        <!-- Meta / Config Modal -->
        <div id="config-modal" class="modal-overlay hidden">
            <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 space-y-6">
                <h3 class="text-xl font-black text-slate-800">テスト・読み込み設定</h3>
                <div class="space-y-4 text-sm">
                    <div>
                        <label class="font-bold text-xs text-slate-500 block mb-1">教科名</label>
                        <input type="text" id="input-subject" value="算数" class="w-full border-2 border-slate-200 p-2.5 rounded-xl font-bold outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="font-bold text-xs text-slate-500 block mb-1">テスト名 / 回数</label>
                        <input type="text" id="input-testname" value="過去問演習" class="w-full border-2 border-slate-200 p-2.5 rounded-xl font-bold outline-none focus:border-blue-500">
                    </div>
                    <hr class="border-slate-100">
                    <button onclick="setConfigAndStart(1)" class="w-full p-4 border-2 border-slate-100 rounded-2xl hover:border-blue-500 hover:bg-blue-50 transition-all text-left group">
                        <div class="font-bold text-slate-700 group-hover:text-blue-700 text-xs">1ファイルにつき 1人分</div>
                    </button>
                    <div class="p-4 border-2 border-slate-100 rounded-2xl bg-slate-50">
                        <div class="font-bold text-slate-700 mb-2 text-xs">1ファイルに全員分</div>
                        <div class="flex items-center gap-2 bg-white p-2 rounded-xl border border-slate-200 mb-3">
                            <label class="text-[11px] font-bold text-slate-500">1人あたり</label>
                            <input type="number" id="pages-per-student" value="1" min="1" class="w-14 border-b-2 border-slate-300 p-1 font-black text-center text-md outline-none">
                            <span class="text-[11px] font-bold text-slate-500">ページ</span>
                        </div>
                        <button onclick="setConfigAndStart(0)" class="w-full bg-slate-800 text-white py-2.5 rounded-xl font-bold text-xs hover:bg-slate-700 transition-all">
                            この構成で開始
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 随時メタデータ変更用モーダル -->
        <div id="meta-modal" class="modal-overlay hidden">
            <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 space-y-4">
                <h3 class="text-xl font-black text-slate-800">テスト情報の編集</h3>
                <div>
                    <label class="font-bold text-xs text-slate-500 block mb-1">教科名</label>
                    <input type="text" id="edit-subject" class="w-full border-2 border-slate-200 p-2.5 rounded-xl font-bold outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="font-bold text-xs text-slate-500 block mb-1">テスト名 / 回数</label>
                    <input type="text" id="edit-testname" class="w-full border-2 border-slate-200 p-2.5 rounded-xl font-bold outline-none focus:border-blue-500">
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="closeMetaModal()" class="flex-1 bg-slate-200 text-slate-700 py-3 rounded-xl font-bold text-xs">キャンセル</button>
                    <button onclick="saveMetaModal()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold text-xs">保存</button>
                </div>
            </div>
        </div>

        <!-- Supabase Cloud Modal -->
        <div id="cloud-modal" class="modal-overlay hidden">
            <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full mx-4 space-y-6 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center border-b pb-3">
                    <h3 class="text-xl font-black text-slate-800">クラウドデータ管理</h3>
                    <button onclick="closeCloudModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                    <label class="font-bold text-xs text-slate-600 block">📷 QRコードから設定を読み込む</label>
                    <div class="flex gap-2">
                        <button onclick="startCameraScanner()" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-blue-700 shadow-sm">カメラでスキャン</button>
                        <button onclick="document.getElementById('qr-file-input').click()" class="bg-slate-200 text-slate-700 px-3 py-2.5 rounded-xl text-xs font-bold">画像ファイル</button>
                    </div>
                    <input type="file" id="qr-file-input" accept="image/*" class="hidden" onchange="scanQrCodeImage(this)">
                </div>
                <div class="space-y-4 text-sm">
                    <div>
                        <label class="font-bold text-xs text-slate-500 block mb-1">カスタムID</label>
                        <input type="text" id="cloud-custom-id" placeholder="例: math-test-01" class="w-full border-2 border-slate-200 p-2.5 rounded-xl font-bold outline-none focus:border-blue-500" oninput="updatePdfUrlFromCustomId()">
                    </div>
                    <div>
                        <label class="font-bold text-xs text-slate-500 block mb-1">パスワード</label>
                        <input type="password" id="cloud-password" placeholder="パスワードを入力" class="w-full border-2 border-slate-200 p-2.5 rounded-xl font-bold outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="font-bold text-xs text-slate-500 block mb-1">PDFのURL一覧</label>
                        <textarea id="cloud-pdf-urls" rows="3" placeholder="https://..." class="w-full border-2 border-slate-200 p-2.5 rounded-xl font-medium outline-none focus:border-blue-500 text-xs"></textarea>
                    </div>
                    <div class="flex gap-3 pt-2">
                        <button onclick="cloudSaveData()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold shadow-md">クラウドに保存</button>
                        <button onclick="cloudLoadData()" class="flex-1 bg-slate-800 text-white py-3 rounded-xl font-bold shadow-md">IDから読み込み</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Camera Modal -->
        <div id="camera-modal" class="modal-overlay hidden z-[150]">
            <div class="relative w-full h-full flex flex-col items-center justify-center overflow-hidden">
                <video id="qr-video" class="absolute inset-0 w-full h-full object-cover" playsinline></video>
                <canvas id="qr-canvas" class="hidden"></canvas>
                <div class="qr-target-box flex items-center justify-center z-10">
                    <p class="text-white/80 font-bold text-xs bg-slate-900/60 px-3 py-1.5 rounded-full backdrop-blur-sm">枠内にQRコードを合わせてください</p>
                </div>
                <button onclick="stopCameraScanner()" class="absolute bottom-10 z-20 bg-white text-slate-900 font-black px-8 py-3 rounded-full shadow-2xl">キャンセル</button>
            </div>
        </div>

        <!-- Step 2: Settings -->
        <section id="step-2" class="hidden flex flex-col flex-grow overflow-hidden relative">
            <div class="flex bg-slate-100 border-b p-1 gap-1 overflow-x-auto shrink-0 no-scrollbar" id="question-tabs"></div>
            
            <div class="flex flex-grow overflow-hidden">
                <div class="w-72 bg-white border-r p-5 overflow-y-auto shrink-0 flex flex-col gap-6 shadow-inner z-20">
                    <div class="space-y-5">
                        <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-widest">設問プロパティ</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 mb-1 block">設問名</label>
                                <input type="text" id="q-label" class="w-full border-2 border-slate-100 p-2.5 rounded-xl text-sm font-bold outline-none focus:border-blue-500" oninput="saveCurrentSettings()">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 mb-1 block">配点</label>
                                    <input type="number" id="q-max" class="w-full border-2 border-slate-100 p-2.5 rounded-xl text-sm font-bold outline-none focus:border-blue-500" oninput="saveCurrentSettings()">
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 mb-1 block">大問グループ</label>
                                    <input type="number" id="q-group" value="1" class="w-full border-2 border-slate-100 p-2.5 rounded-xl text-sm font-bold outline-none focus:border-blue-500" oninput="saveCurrentSettings()">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="pt-6 border-t space-y-3">
                        <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-widest">スタンプ配置</h3>
                        <button onclick="toggleTotalMode('total')" class="w-full bg-orange-50 border-2 border-orange-100 p-3 rounded-xl text-[11px] font-black text-orange-600 text-left">総合計の枠を配置</button>
                        <div id="group-pos-container" class="space-y-2"></div>
                    </div>

                    <div class="mt-auto pt-6 border-t">
                        <button id="go-to-scoring" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-xl shadow-blue-100 hover:bg-blue-700">採点画面へ進む</button>
                    </div>
                </div>

                <div class="flex-grow relative overflow-hidden">
                    <div class="guide-label mode-question" id="guide-label">設問範囲をタップ（始点・終点）</div>
                    <div id="canvas-container">
                        <canvas id="base-canvas"></canvas>
                        <canvas id="selection-canvas"></canvas>
                    </div>
                    <div class="absolute bottom-6 right-6 flex flex-col gap-2">
                        <button onclick="adjustZoom(1.2)" class="w-10 h-10 bg-white shadow-lg rounded-full font-bold text-slate-600">＋</button>
                        <button onclick="adjustZoom(0.8)" class="w-10 h-10 bg-white shadow-lg rounded-full font-bold text-slate-600">－</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Step 3: Scoring List -->
        <section id="step-3" class="hidden flex flex-col flex-grow overflow-hidden bg-slate-100">
            <div class="bg-white p-3 px-6 flex justify-between items-center shadow-sm shrink-0 z-20 border-b">
                <div class="flex items-center gap-4">
                    <button onclick="backToSettings()" class="text-slate-400 hover:text-slate-600 font-bold text-xs uppercase">← Back to Setup</button>
                    <h2 id="active-q-display" class="font-black text-xl text-slate-800 ml-6">問1 <span class="text-slate-300 font-medium">/ 10pts</span></h2>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="downloadCSV()" class="text-slate-500 border-2 border-slate-100 px-4 py-2 rounded-xl font-bold text-[11px] hover:bg-slate-50">CSV出力</button>
                    <button onclick="exportAllPDFs()" class="bg-slate-800 text-white px-5 py-2 rounded-xl font-bold text-[11px] hover:bg-slate-700">全員分の答案PDFを一括保存</button>
                </div>
            </div>
            <div id="scoring-list" class="flex-grow overflow-y-auto p-4 space-y-2"></div>
            <div class="bg-white border-t p-4 shrink-0 flex justify-center gap-4 shadow-lg z-30">
                <button onclick="prevQuestion()" class="bg-slate-100 text-slate-600 px-10 py-4 rounded-2xl font-black text-sm">前へ</button>
                <button onclick="nextQuestion()" class="bg-blue-600 text-white px-16 py-4 rounded-2xl font-black text-sm shadow-xl shadow-blue-100">次へ</button>
            </div>
        </section>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        const { jsPDF } = window.jspdf;

        const SUPABASE_URL = 'https://qfzyrogwyjbzbblnvqzy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tXLLvKe_L-27OsGU-GH3Zw_176oxBqw';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentRecordId = null;
        let testMeta = { subject: '算数', testname: '過去問演習' };

        let students = [];
        let questions = [];
        let allPages = [];
        let activeQIdx = -1;
        let zoom = 1.0, offsetX = 0, offsetY = 0;
        let selectionStart = null;
        let activePointers = new Map();
        let isDragging = false, lastTouchPos = null, initialDistance = 0, initialZoom = 1.0;
        let totalScoreRect = null;
        let groupScoreRects = {};
        let currentSettingMode = 'question';
        let rawFiles = [];
        let cameraStream = null, animationFrameId = null;

        const container = document.getElementById('canvas-container');
        const bCanvas = document.getElementById('base-canvas');
        const sCanvas = document.getElementById('selection-canvas');

        function openCloudModal() { document.getElementById('cloud-modal').classList.remove('hidden'); }
        function closeCloudModal() { document.getElementById('cloud-modal').classList.add('hidden'); }
        
        function openMetaModal() {
            document.getElementById('edit-subject').value = testMeta.subject;
            document.getElementById('edit-testname').value = testMeta.testname;
            document.getElementById('meta-modal').classList.remove('hidden');
        }
        function closeMetaModal() { document.getElementById('meta-modal').classList.add('hidden'); }
        function saveMetaModal() {
            testMeta.subject = document.getElementById('edit-subject').value;
            testMeta.testname = document.getElementById('edit-testname').value;
            updateHeaderMeta();
            closeMetaModal();
        }
        function updateHeaderMeta() {
            document.getElementById('header-subject').innerText = testMeta.subject;
            document.getElementById('header-testname').innerText = testMeta.testname;
        }

        function updatePdfUrlFromCustomId() {
            const val = document.getElementById('cloud-custom-id').value.trim();
            if (val) {
                document.getElementById('cloud-pdf-urls').value = `https://qfzyrogwyjbzbblnvqzy.supabase.co/storage/v1/object/public/benkyo/${val}.pdf`;
            }
        }

        function applyParsedQrText(rawText) {
            const parts = rawText.split(',');
            if (parts.length < 2) return false;
            document.getElementById('cloud-custom-id').value = parts[0].trim();
            document.getElementById('cloud-password').value = parts[1].trim();
            updatePdfUrlFromCustomId();
            return true;
        }

        async function startCameraScanner() {
            const video = document.getElementById('qr-video');
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));
                video.srcObject = cameraStream;
                await video.play();
                document.getElementById('camera-modal').classList.remove('hidden');
                animationFrameId = requestAnimationFrame(scanCameraFrame);
            } catch (err) { alert("カメラを起動できませんでした"); }
        }

        function stopCameraScanner() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
            document.getElementById('camera-modal').classList.add('hidden');
        }

        function scanCameraFrame() {
            const video = document.getElementById('qr-video');
            const canvas = document.getElementById('qr-canvas');
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                if (code && applyParsedQrText(code.data.trim())) {
                    stopCameraScanner();
                    alert("QRコードを読み込みました！");
                    return;
                }
            }
            animationFrameId = requestAnimationFrame(scanCameraFrame);
        }

        async function scanQrCodeImage(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const cvs = document.createElement('canvas');
                    cvs.width = img.width; cvs.height = img.height;
                    const ctx = cvs.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const code = jsQR(ctx.getImageData(0, 0, cvs.width, cvs.height).data, cvs.width, cvs.height);
                    if (code && applyParsedQrText(code.data.trim())) alert("QR設定を読み込みました！");
                    else alert("QRコードが見つかりませんでした");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        async function cloudSaveData() {
            const customId = document.getElementById('cloud-custom-id').value.trim();
            const password = document.getElementById('cloud-password').value;
            if (!customId) return alert("カスタムIDを入力してください");

            const payload = {
                custom_id: customId,
                password,
                pdf_urls: document.getElementById('cloud-pdf-urls').value.trim(),
                question_config: questions,
                stamp_config: { totalScoreRect, groupScoreRects },
                scores_data: students.map(s => ({ name: s.name, scores: s.scores })),
                test_meta: testMeta
            };

            let query = supabaseClient.from('tests');
            let res;
            if (currentRecordId) {
                res = await query.update(payload).eq('id', currentRecordId);
            } else {
                const { data: existing } = await query.select('id').eq('custom_id', customId).single();
                if (existing) { currentRecordId = existing.id; res = await query.update(payload).eq('id', currentRecordId); }
                else { res = await query.insert([payload]).select(); if (res.data) currentRecordId = res.data[0].id; }
            }

            if (res.error) alert("保存失敗: " + res.error.message);
            else { alert("クラウド保存しました！"); closeCloudModal(); }
        }

        async function cloudLoadData() {
            const customId = document.getElementById('cloud-custom-id').value.trim();
            const password = document.getElementById('cloud-password').value;
            if (!customId) return alert("カスタムIDを入力してください");

            const { data, error } = await supabaseClient.from('tests').select('*').eq('custom_id', customId).single();
            if (error || !data) return alert("データが見つかりませんでした");
            if (data.password && data.password !== password) return alert("パスワードが一致しません");

            currentRecordId = data.id;
            document.getElementById('cloud-pdf-urls').value = data.pdf_urls || '';
            questions = data.question_config || [];
            if (data.stamp_config) { totalScoreRect = data.stamp_config.totalScoreRect || null; groupScoreRects = data.stamp_config.groupScoreRects || {}; }
            if (data.test_meta) { testMeta = data.test_meta; updateHeaderMeta(); }
            
            const rawScoresList = data.scores_data || [];
            if (data.pdf_urls) {
                const urls = data.pdf_urls.split(/[\n,]/).map(u => u.trim()).filter(u => u);
                if (urls.length > 0) {
                    students = []; allPages = [];
                    for (let i = 0; i < urls.length; i++) {
                        try {
                            const res = await fetch(urls[i]);
                            const blob = await res.blob();
                            const file = new File([blob], `student_${i+1}.pdf`, { type: 'application/pdf' });
                            const pages = await extractPages(file, 2.0);
                            const found = rawScoresList[i];
                            const name = found ? found.name : `生徒 ${i+1}`;
                            const scores = found ? found.scores : {};
                            students.push({ name, pages, scores });
                            if (i === 0) allPages = pages;
                        } catch (e) { console.error(e); }
                    }
                    if (students.length > 0) {
                        document.getElementById('step-1').classList.add('hidden');
                        document.getElementById('step-2').classList.remove('hidden');
                        if (!questions.length) addQuestion();
                        else { activeQIdx = 0; renderTabs(); updateForm(); renderGroupButtons(); }
                        initCanvas(); closeCloudModal(); alert("読み込み成功！");
                        return;
                    }
                }
            }
            alert("設定とデータを読み込みました");
            closeCloudModal();
        }

        document.getElementById('file-input').onchange = (e) => {
            rawFiles = Array.from(e.target.files);
            if (rawFiles.length) document.getElementById('config-modal').classList.remove('hidden');
        };

        async function setConfigAndStart(isOnePerFile) {
            testMeta.subject = document.getElementById('input-subject').value;
            testMeta.testname = document.getElementById('input-testname').value;
            updateHeaderMeta();
            document.getElementById('config-modal').classList.add('hidden');
            
            students = []; allPages = [];
            const SCALE = 2.0;

            if (isOnePerFile) {
                for (let i = 0; i < rawFiles.length; i++) {
                    const file = rawFiles[i];
                    const defaultName = file.name.replace(/\.[^/.]+$/, "");
                    const pages = await extractPages(file, SCALE);
                    students.push({ name: defaultName, pages, scores: {} });
                    if (i === 0) allPages = pages;
                }
            } else {
                const pps = parseInt(document.getElementById('pages-per-student').value) || 1;
                const file = rawFiles[0];
                const fullPages = await extractPages(file, SCALE);
                allPages = fullPages.slice(0, pps);
                for (let i = 0; i < fullPages.length; i += pps) {
                    students.push({ name: `生徒 ${(i/pps)+1}`, pages: fullPages.slice(i, i + pps), scores: {} });
                }
            }

            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            if (!questions.length) addQuestion();
            initCanvas();
        }

        async function extractPages(file, scale) {
            const pages = [];
            if (file.type === 'application/pdf') {
                const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i), vp = page.getViewport({ scale });
                    const canvas = document.createElement('canvas');
                    canvas.width = vp.width; canvas.height = vp.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
                    pages.push(canvas);
                }
            } else {
                const img = await new Promise(r => { const rd = new FileReader(); rd.onload = e => { const im = new Image(); im.onload = () => r(im); im.src = e.target.result; }; rd.readAsDataURL(file); });
                const canvas = document.createElement('canvas');
                canvas.width = img.width; canvas.height = img.height;
                canvas.getContext('2d').drawImage(img, 0, 0);
                pages.push(canvas);
            }
            return pages;
        }

        function addQuestion() {
            questions.push({ id: Date.now(), label: `問${questions.length + 1}`, group: 1, max: 10, rect: null });
            activeQIdx = questions.length - 1;
            renderTabs(); updateForm(); renderGroupButtons(); drawSelection();
        }

        function switchTab(idx) { currentSettingMode = 'question'; activeQIdx = idx; renderTabs(); updateForm(); drawSelection(); updateGuide(); }

        function updateForm() {
            const q = questions[activeQIdx]; if (!q) return;
            document.getElementById('q-label').value = q.label;
            document.getElementById('q-group').value = q.group;
            document.getElementById('q-max').value = q.max;
        }

        function saveCurrentSettings() {
            const q = questions[activeQIdx]; if (!q) return;
            q.label = document.getElementById('q-label').value;
            q.group = parseInt(document.getElementById('q-group').value) || 1;
            q.max = parseFloat(document.getElementById('q-max').value) || 0;
            renderTabs(); renderGroupButtons(); updateGlobalStats();
        }

        function renderTabs() {
            const html = questions.map((q, i) => `<button onclick="switchTab(${i})" class="tab-btn px-5 py-3 rounded-t-xl font-black shrink-0 text-[11px] ${i === activeQIdx && currentSettingMode === 'question' ? 'active bg-white text-slate-800' : 'text-slate-400'}">${q.label || '?'}</button>`).join('') + `<button onclick="addQuestion()" class="px-5 py-3 text-blue-500 font-black text-[11px]">+ NEW</button>`;
            document.getElementById('question-tabs').innerHTML = html;
        }

        function renderGroupButtons() {
            const groups = [...new Set(questions.map(q => q.group))].sort((a,b)=>a-b);
            document.getElementById('group-pos-container').innerHTML = groups.map(g => `<button onclick="toggleTotalMode('group-${g}')" class="w-full bg-emerald-50 border-2 border-emerald-100 p-3 rounded-xl text-[11px] font-black text-emerald-600 text-left">大問${g}の合計枠を配置</button>`).join('');
        }

        function toggleTotalMode(mode) { currentSettingMode = mode; renderTabs(); drawSelection(); updateGuide(); }

        function updateGuide() {
            const guide = document.getElementById('guide-label');
            guide.className = "guide-label";
            if (currentSettingMode === 'question') { guide.innerText = "設問範囲を指定 (2点をタップ)"; guide.classList.add('mode-question'); }
            else if (currentSettingMode === 'total') { guide.innerText = "総合計スタンプの位置を指定"; guide.classList.add('mode-total'); }
            else { guide.innerText = `大問${currentSettingMode.split('-')[1]}の合計位置を指定`; guide.classList.add('mode-group'); }
        }

        function initCanvas() {
            let totalH = 0, maxW = 0;
            allPages.forEach(c => { totalH += c.height; maxW = Math.max(maxW, c.width); });
            bCanvas.width = sCanvas.width = maxW; bCanvas.height = sCanvas.height = totalH;
            resetZoom();
        }

        function resetZoom() { 
            zoom = (container.clientWidth * 0.9) / (bCanvas.width || 1); 
            offsetX = (container.clientWidth - bCanvas.width * zoom) / 2; 
            offsetY = 40; 
            applyTransform(); 
        }

        function adjustZoom(f) {
            zoom *= f;
            applyTransform();
        }

        function applyTransform() {
            bCanvas.style.transform = sCanvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${zoom})`;
            const ctx = bCanvas.getContext('2d'); ctx.clearRect(0,0,bCanvas.width, bCanvas.height);
            let y = 0; allPages.forEach(c => { ctx.drawImage(c, 0, y); y += c.height; });
            drawSelection();
        }

        container.onpointerdown = (e) => {
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (activePointers.size === 1) { isDragging = true; lastTouchPos = { x: e.clientX, y: e.clientY }; }
        };

        container.onpointermove = (e) => {
            if (!activePointers.has(e.pointerId)) return;
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (activePointers.size === 1 && isDragging) {
                offsetX += e.clientX - lastTouchPos.x;
                offsetY += e.clientY - lastTouchPos.y;
                lastTouchPos = { x: e.clientX, y: e.clientY };
                applyTransform();
            }
        };

        container.onpointerup = container.onpointercancel = (e) => {
            const start = activePointers.get(e.pointerId);
            if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 5) {
                const rect = container.getBoundingClientRect();
                handleTap({ x: e.clientX - rect.left, y: e.clientY - rect.top });
            }
            activePointers.delete(e.pointerId);
            if (activePointers.size === 0) isDragging = false;
        };

        function handleTap(pos) {
            const wx = (pos.x - offsetX) / zoom, wy = (pos.y - offsetY) / zoom;
            if (!selectionStart) { selectionStart = { x: wx, y: wy }; } 
            else {
                let pIdx = 0, cy = 0, miny = Math.min(selectionStart.y, wy);
                for (let i = 0; i < allPages.length; i++) {
                    if (miny >= cy && miny < cy + allPages[i].height) { pIdx = i; break; }
                    cy += allPages[i].height;
                }
                const rect = { x: Math.min(selectionStart.x, wx), y: miny - cy, w: Math.abs(selectionStart.x - wx), h: Math.abs(selectionStart.y - wy), pageIdx: pIdx };
                if (rect.w > 2) {
                    if (currentSettingMode === 'question') questions[activeQIdx].rect = rect;
                    else if (currentSettingMode === 'total') totalScoreRect = rect;
                    else if (currentSettingMode.startsWith('group-')) groupScoreRects[currentSettingMode.split('-')[1]] = rect;
                }
                selectionStart = null;
            }
            drawSelection();
        }

        function drawSelection() {
            const ctx = sCanvas.getContext('2d'); ctx.clearRect(0,0,sCanvas.width, sCanvas.height);
            const getOff = idx => { let y=0; for(let i=0; i<idx; i++) y+=allPages[i].height; return y; };
            questions.forEach((q, i) => {
                if (!q.rect) return;
                const py = getOff(q.rect.pageIdx);
                ctx.strokeStyle = (i === activeQIdx && currentSettingMode === 'question') ? '#3b82f6' : 'rgba(148, 163, 184, 0.5)';
                ctx.lineWidth = 4/zoom; ctx.strokeRect(q.rect.x, q.rect.y + py, q.rect.w, q.rect.h);
            });
            if (totalScoreRect) { const py = getOff(totalScoreRect.pageIdx); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 5/zoom; ctx.strokeRect(totalScoreRect.x, totalScoreRect.y + py, totalScoreRect.w, totalScoreRect.h); }
            Object.keys(groupScoreRects).forEach(gid => { const r = groupScoreRects[gid]; const py = getOff(r.pageIdx); ctx.strokeStyle = '#10b981'; ctx.lineWidth = 5/zoom; ctx.strokeRect(r.x, r.y + py, r.w, r.h); });
        }

        function renderScoringList() {
            const q = questions[activeQIdx];
            document.getElementById('active-q-display').innerHTML = `${q.label} <span class="text-slate-400 font-medium text-sm ml-2">/ ${q.max} pts</span>`;
            const list = document.getElementById('scoring-list'); list.innerHTML = '';
            
            students.forEach((s, idx) => {
                const card = document.createElement('div'); card.className = 'scoring-card';
                
                // クロップサムネイル
                const cropBox = document.createElement('div'); cropBox.className = 'crop-container';
                const cropCvs = document.createElement('canvas');
                if (q.rect) {
                    cropCvs.width = q.rect.w; cropCvs.height = q.rect.h;
                    const tp = s.pages[q.rect.pageIdx];
                    if (tp) cropCvs.getContext('2d').drawImage(tp, q.rect.x, q.rect.y, q.rect.w, q.rect.h, 0, 0, q.rect.w, q.rect.h);
                }
                cropBox.appendChild(cropCvs);

                // コントロール (生徒名手入力対応 + 点数入力 + 個別PDF出力ボタン)
                const controls = document.createElement('div'); controls.className = 'score-controls';
                controls.innerHTML = `
                    <input type="text" class="text-xs font-black text-slate-700 bg-transparent border-b border-dashed border-slate-300 pb-0.5 mb-1 outline-none focus:border-blue-500" value="${s.name}" oninput="students[${idx}].name = this.value">
                    <div class="flex items-center gap-2 mb-2">
                        <input type="number" step="any" inputmode="decimal" class="score-input" value="${s.scores[q.id] || ''}">
                        <span class="text-slate-300 font-bold text-xs">/ ${q.max}</span>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="exportSingleStudentPDF(${idx})" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-bold py-1.5 rounded-lg transition-all">答案PDF</button>
                        <button onclick="exportSingleReportPDF(${idx})" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-600 text-[10px] font-bold py-1.5 rounded-lg transition-all">成績表PDF</button>
                    </div>
                `;
                
                const input = controls.querySelector('.score-input');
                input.oninput = () => { s.scores[q.id] = input.value; updateGlobalStats(); };
                
                card.appendChild(cropBox); card.appendChild(controls); list.appendChild(card);
            });
            updateGlobalStats();
        }

        function updateGlobalStats() {
            let totalEarned = 0, totalPossible = questions.reduce((a, b) => a + b.max, 0);
            students.forEach(s => { questions.forEach(q => { totalEarned += (parseFloat(s.scores[q.id]) || 0); }); });
            document.getElementById('total-avg').innerText = (totalEarned / (students.length || 1)).toFixed(1);
            document.getElementById('total-max').innerText = totalPossible;
            document.getElementById('stats-summary').classList.remove('hidden');
        }

        document.getElementById('go-to-scoring').onclick = () => { if (!questions.some(q => q.rect)) return alert("設問範囲を指定してください"); document.getElementById('step-2').classList.add('hidden'); document.getElementById('step-3').classList.remove('hidden'); renderScoringList(); };
        function nextQuestion() { if (activeQIdx < questions.length - 1) { activeQIdx++; renderScoringList(); } }
        function prevQuestion() { if (activeQIdx > 0) { activeQIdx--; renderScoringList(); } }
        function backToSettings() { document.getElementById('step-3').classList.add('hidden'); document.getElementById('step-2').classList.remove('hidden'); drawSelection(); }

        // 生徒ごとの答案PDF単体出力
        async function exportSingleStudentPDF(idx) {
            const s = students[idx];
            const fp = s.pages[0];
            const doc = new jsPDF({ unit: 'pt', format: [fp.width, fp.height], orientation: fp.width > fp.height ? 'l' : 'p' });
            
            for (let i = 0; i < s.pages.length; i++) {
                const page = s.pages[i];
                if (i > 0) doc.addPage([page.width, page.height], page.width > page.height ? 'l' : 'p');
                doc.setPage(i + 1);
                doc.addImage(page.toDataURL('image/jpeg', 0.8), 'JPEG', 0, 0, page.width, page.height);
                
                questions.forEach(q => {
                    if (q.rect && q.rect.pageIdx === i && s.scores[q.id] !== undefined && s.scores[q.id] !== "") {
                        drawMarkPDF(doc, s.scores[q.id], q.max, q.rect);
                    }
                });
                if (totalScoreRect && totalScoreRect.pageIdx === i) {
                    const total = questions.reduce((sum, q) => sum + (parseFloat(s.scores[q.id]) || 0), 0);
                    drawTotalMarkPDF(doc, total, totalScoreRect);
                }
            }
            doc.save(`${s.name}_採点済み答案.pdf`);
        }

        // 全員分の答案PDFを順次ダウンロード
        async function exportAllPDFs() {
            for (let i = 0; i < students.length; i++) {
                await exportSingleStudentPDF(i);
            }
        }

        // 個人成績表PDFの生成・ダウンロード (A4縦)
        async function exportSingleReportPDF(idx) {
            const s = students[idx];
            const doc = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'p' });
            const pageWidth = doc.internal.pageSize.getWidth();
            
            let totalEarned = 0, totalPossible = questions.reduce((acc, q) => acc + q.max, 0);
            questions.forEach(q => { totalEarned += (parseFloat(s.scores[q.id]) || 0); });

            // ヘッダー部
            doc.setFontSize(18); doc.text("個人成績表", pageWidth / 2, 40, { align: 'center' });
            doc.setFontSize(11); doc.setTextColor(100);
            doc.text(`テスト: ${testMeta.testname} (${testMeta.subject})`, 40, 75);
            doc.text(`氏名: ${s.name}`, 40, 95);
            
            doc.setFontSize(14); doc.setTextColor(0);
            doc.text(`総合得点: ${totalEarned} / ${totalPossible} 点`, pageWidth - 40, 85, { align: 'right' });

            doc.setDrawColor(200); doc.line(40, 110, pageWidth - 40, 110);

            // 設問別明細テーブル
            let y = 140;
            doc.setFontSize(12);
            doc.text("■ 設問別得点明細", 40, y);
            y += 20;

            doc.setFillColor(240, 243, 246);
            doc.rect(40, y, pageWidth - 80, 24, 'F');
            doc.setFontSize(10);
            doc.text("設問名", 50, y + 16);
            doc.text("配点", 200, y + 16);
            doc.text("得点", 300, y + 16);
            doc.text("正誤判定", 400, y + 16);
            y += 24;

            questions.forEach(q => {
                const sc = s.scores[q.id];
                const scoreVal = sc !== undefined && sc !== "" ? parseFloat(sc) : "-";
                let status = "-";
                if (scoreVal !== "-") {
                    if (scoreVal >= q.max) status = "◎ (正解)";
                    else if (scoreVal <= 0) status = "× (不正解)";
                    else status = "△ (部分点)";
                }

                doc.text(q.label, 50, y + 16);
                doc.text(`${q.max}点`, 200, y + 16);
                doc.text(`${scoreVal}点`, 300, y + 16);
                doc.text(status, 400, y + 16);
                
                doc.setDrawColor(230); doc.line(40, y + 24, pageWidth - 40, y + 24);
                y += 24;
            });

            doc.save(`${s.name}_${testMeta.testname}_成績表.pdf`);
        }

        function drawMarkPDF(doc, score, max, rect) {
            const sc = parseFloat(score || 0), mx = parseFloat(max);
            doc.setDrawColor(255, 0, 0); doc.setLineWidth(3);
            const cx = rect.x + rect.w/2, cy = rect.y + rect.h/2, r = Math.min(rect.w, rect.h) * 0.45;
            if (sc >= mx) doc.circle(cx, cy, r);
            else if (sc <= 0) { doc.line(cx - r/2, cy, cx - r/4, cy + r/2); doc.line(cx - r/4, cy + r/2, cx + r/2, cy - r/2); }
            else { 
                doc.line(cx, cy - r, cx - r, cy + r); doc.line(cx - r, cy + r, cx + r, cy + r); doc.line(cx + r, cy + r, cx, cy - r);
                doc.setFontSize(r * 0.8); doc.setTextColor(255, 0, 0); doc.text(`${sc}`, cx, cy + r/2, { align: 'center' });
            }
        }

        function drawTotalMarkPDF(doc, score, rect) { 
            doc.setDrawColor(255, 0, 0); doc.setLineWidth(4); doc.rect(rect.x, rect.y, rect.w, rect.h); 
            const fs = Math.min(rect.w, rect.h) * 0.7; 
            doc.setFontSize(fs); doc.setTextColor(255,0,0); 
            doc.text(`${score}`, rect.x + rect.w/2, rect.y + rect.h/2 + fs/3, {align: 'center'}); 
        }

        function downloadCSV() {
            let csv = "\uFEFFStudent,Question,Score,Max\n";
            students.forEach(s => { questions.forEach(q => { csv += `${s.name},${q.label},${s.scores[q.id] || 0},${q.max}\n`; }); });
            const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;' })); link.download = "scoring_results.csv"; link.click();
        }
    </script>
</body>
</html>
